<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>தமிழ் டப்பிங் குரல்</title>
<style>
body{font-family:'Noto Sans Tamil',system-ui,sans-serif;margin:0;padding:14px;background:#f5f6fa;color:#1d2433}
@media (prefers-color-scheme:dark){body{background:#12151c;color:#e8ebf2}}
button{padding:12px 18px;border:0;border-radius:8px;background:#c0392b;color:#fff;font:inherit;font-size:16px;cursor:pointer}
select{width:100%;padding:8px;margin:8px 0;font:inherit}
#tx{font-size:20px;line-height:1.6;min-height:90px;margin-top:10px;padding:10px;border-radius:8px;background:rgba(128,128,128,.15)}
#st{font-size:13px;opacity:.8}
</style></head><body>
<h3>🎙️ தமிழ் டப்பிங் குரல்</h3>
<div id="st">YouTube tab-ல் Bookmark/Console code ஓட்டவும். இந்த window-ஐ மூடாமல் வைக்கவும்.</div>
<button id="on">🔊 குரலை இயக்கு</button>
<select id="voice"></select>
<label>வேகம் <input type="range" id="spd" min="0.8" max="1.8" step="0.1" value="1.1"></label>
<div id="tx">காத்திருக்கிறது...</div>
<script>
const API='https://script.google.com/macros/s/AKfycbyd72YokjJMy3eYQkUEYxjk1QCFf6cFqVv9j7ka0oMjYcOI6lzE_CpQOafe88ZoLc5-/exec';
const YT='https://www.youtube.com',$=id=>document.getElementById(id);
let ready=false,cache={},voices=[];
function lv(){voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('ta'));
 $('voice').innerHTML=voices.length?voices.map((v,i)=>'<option value="'+i+'">'+v.name+'</option>').join(''):'<option>⚠ தமிழ் குரல் இல்லை - Windows Settings > Speech-ல் Tamil நிறுவவும்</option>'}
speechSynthesis.onvoiceschanged=lv;lv();
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';
 const v=voices[$('voice').value||0];if(v)u.voice=v;u.rate=+$('spd').value;speechSynthesis.speak(u)}
$('on').onclick=()=>{ready=true;speak('தமிழ் டப்பிங் தயார்');$('on').style.display='none'};
async function tr(t){if(cache[t])return cache[t];const r=await fetch(API+'?tr='+encodeURIComponent(t));const j=await r.json();if(j.error)throw j.error;return cache[t]=j.t}
let cur='';
addEventListener('message',async e=>{
 if(e.origin!==YT)return;const d=e.data||{};
 if(d.type==='stop'){speechSynthesis.cancel();return}
 if(d.type!=='cap')return;
 cur=d.t;
 try{const ta=await tr(d.t);if(cur!==d.t)return;$('tx').textContent=ta;
  e.source.postMessage({type:'tr',t:ta},e.origin);if(ready)speak(ta)}
 catch(err){$('tx').textContent='பிழை: '+err}
});
</script></body></html>
